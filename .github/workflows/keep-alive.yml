name: Keep Render alive

on:
  schedule:
    - cron: '0 * * * *'   # every hour (was every 14 min - reduced to save Neon data transfer quota)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://maintenance-analytics-mvp.onrender.com/health || true
